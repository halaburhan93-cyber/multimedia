<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>تسجيل الدخول — MultiMedia Converter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎛️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page" data-page="login">
  <main class="auth-shell">
    <aside class="auth-brand">
      <a href="index.html" class="auth-logo" aria-label="الصفحة الرئيسية">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect x="4" y="10" width="30" height="30" rx="8" fill="#fff" opacity=".9" />
          <circle cx="40" cy="38" r="18" fill="#fff" opacity=".55" />
          <path d="M34 30 L50 38 L34 46 Z" fill="#D6337F" />
        </svg>
      </a>
      <h1 dir="ltr">MultiMedia Converter</h1>
      <p>حوّل الصور والصوت والفيديو، واحتفظ بملفاتك في مكتبتك الخاصة.</p>
    </aside>

    <section class="auth-card">
      <h2>تسجيل الدخول</h2>
      <p class="auth-lead">ادخل إلى حسابك لتحويل ملفاتك وإدارتها.</p>
      <div id="authMsg" class="auth-msg" role="alert" hidden></div>
      <form id="loginForm" class="auth-form" novalidate>
        <label class="field"><span>البريد الإلكتروني</span>
          <input type="email" name="email" autocomplete="email" inputmode="email" dir="ltr" required placeholder="name@example.com" />
        </label>
        <label class="field"><span>كلمة المرور</span>
          <div class="pw">
            <input type="password" name="password" autocomplete="current-password" dir="ltr" required />
            <button type="button" class="pw-toggle" aria-pressed="false">إظهار</button>
          </div>
        </label>
        <a class="auth-link auth-forgot" href="forgot-password.html">نسيت كلمة المرور؟</a>
        <button type="submit" class="btn btn--primary btn--block">تسجيل الدخول</button>
        <button type="button" id="resendBtn" class="btn btn--ghost btn--block" hidden>أعد إرسال رسالة التأكيد</button>
      </form>
      <p class="auth-switch">ليس لديك حساب؟ <a class="auth-link" href="signup.html">أنشئ حسابًا جديدًا</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
