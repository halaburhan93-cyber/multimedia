<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>استعادة كلمة المرور — MultiMedia Converter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎛️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page" data-page="forgot">
  <main class="auth-shell">
    <aside class="auth-brand">
      <a href="index.html" class="auth-logo" aria-label="الصفحة الرئيسية">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect x="4" y="10" width="30" height="30" rx="8" fill="#fff" opacity=".9" />
          <circle cx="40" cy="38" r="18" fill="#fff" opacity=".55" />
          <path d="M34 30 L50 38 L34 46 Z" fill="#D6337F" />
        </svg>
      </a>
      <h1 dir="ltr">MultiMedia Converter</h1>
      <p>حوّل الصور والصوت والفيديو، واحتفظ بملفاتك في مكتبتك الخاصة.</p>
    </aside>

    <section class="auth-card">
      <h2>استعادة كلمة المرور</h2>
      <p class="auth-lead">اكتب بريدك وسنرسل لك رابطًا لتعيين كلمة مرور جديدة.</p>
      <div id="authMsg" class="auth-msg" role="alert" hidden></div>
      <form id="forgotForm" class="auth-form" novalidate>
        <label class="field"><span>البريد الإلكتروني</span>
          <input type="email" name="email" autocomplete="email" inputmode="email" dir="ltr" required placeholder="name@example.com" />
        </label>
        <button type="submit" class="btn btn--primary btn--block">أرسل رابط الاستعادة</button>
      </form>
      <p class="auth-switch">تذكّرت كلمة المرور؟ <a class="auth-link" href="login.html">ارجع لتسجيل الدخول</a></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
